<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .content-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th:first-child, td:first-child {
            width: 60%;
        }
        th:not(:first-child), td:not(:first-child) {
            width: 40%;
            overflow: scroll;
            white-space: nowrap;
        }
        th {
            background-color: #f2f2f2;
        }
        .queued {
            background-color: #e0e0e0;
        }
        .running {
            background-color: #fffde7;
        }
        .passed {
            background-color: #e8f5e9;
        }
        .failed {
            background-color: #ffebee;
        }
        .section-header {
            background-color: #fefefe;
            font-weight: bold;
        }
        #summaryContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 20px;
        }
        .summaryBox {
            width: 25px;
            height: 25px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<script src="/braid-http-client.js"></script>
<script src="./tests.js"></script>

<div class="content-container">
    <div id="summaryContainer"></div>
    <table id="testTable">
        <tr>
            <th>Name</th>
            <th>Result</th>
        </tr>
    </table>
</div>
<script type=module>

var port = parseInt(location.port)
var delay = 0

// Parse URL parameters for filter
var url_params = new URLSearchParams(window.location.search)
var filter_arg = url_params.get('filter') || url_params.get('grep')

function create_test_row(test_name) {
    var row = document.createElement("tr")
    row.innerHTML = `
        <td>${test_name}</td>
        <td class="result">Queued...</td>
    `
    row.className = "queued"
    testTable.appendChild(row)
    return row
}

function update_test_result(row, status, got) {
    row.className = status
    row.querySelector(".result").textContent = got
}

function add_section_header(header_text) {
    var row = document.createElement("tr")
    var cell = document.createElement("td")
    cell.textContent = header_text
    cell.className = "section-header"
    cell.setAttribute("colspan", "2")
    row.appendChild(cell)
    testTable.appendChild(row)
}

var summaryContainer = document.getElementById('summaryContainer')

function create_summary_box() {
    var box = document.createElement('div')
    box.className = 'summaryBox queued'
    summaryContainer.appendChild(box)
    return box
}

function update_summary_box(box, passed) {
    box.className = `summaryBox ${passed ? 'passed' : 'failed'}`
}

function assert(condition, message) {
    if (!condition) throw new Error(message || 'Assertion failed')
}

function run_test(test_name, test_function, expected_result) {
    // Apply filter if specified
    if (filter_arg && !test_name.toLowerCase().includes(filter_arg.toLowerCase())) {
        return // Skip this test
    }

    var row = create_test_row(test_name)
    var summary_box = create_summary_box()

    // Stagger the tests' start times, so they don't all fire at once
    delay += 70
    var my_delay = delay

    ;(async () => {
        await new Promise(done => setTimeout(done, my_delay))

        summary_box.className = 'summaryBox running'
        update_test_result(row, 'running', 'Running...')

        try {
            var got = await test_function()
            if (expected_result === undefined) {
                // Assertion-style test: success simply means it returned
                // (without throwing). An assert() failure throws and is
                // handled by the catch below.
                update_test_result(row, 'passed', 'passed')
                update_summary_box(summary_box, true)
            } else if (got == expected_result) {
                update_test_result(row, 'passed', got)
                update_summary_box(summary_box, true)
            } else {
                update_test_result(row, 'failed', `${got} (expected: ${expected_result})`)
                update_summary_box(summary_box, false)
            }
        } catch (error) {
            update_test_result(row, 'failed', error.message || error)
            update_summary_box(summary_box, false)
        }
    })()
}

// Load and run all tests from the shared tests.js file
define_tests(run_test, { braid_fetch, assert, add_section_header, port })

</script>
